<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="55%" stop-color="#292524" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1C1917" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="plate1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F5F4" />
      <stop offset="85%" stop-color="#E7E5E4" />
      <stop offset="100%" stop-color="#D6D3D1" />
    </radialGradient>
    <radialGradient id="pizzaCrust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="78%" stop-color="#D97706" />
      <stop offset="95%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#glow)" />
  <!-- Subtle architectural grid lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>
  <!-- Main Centerpiece: Artisanal Wood-Fired Pizza on Ceramic Platter -->
  <g transform="translate(640, 340)">
    <circle cx="8" cy="14" r="225" fill="#000000" fill-opacity="0.45" />
    <circle cx="0" cy="0" r="220" fill="url(#plate1)" />
    <circle cx="0" cy="0" r="195" fill="url(#pizzaCrust)" />
    <circle cx="0" cy="0" r="170" fill="#DC2626" />
    <!-- Burrata & Mozzarella pools -->
    <circle cx="-65" cy="-55" r="34" fill="#FFFBEB" />
    <circle cx="70" cy="-45" r="30" fill="#FFFBEB" />
    <circle cx="-45" cy="70" r="32" fill="#FFFBEB" />
    <circle cx="65" cy="65" r="35" fill="#FFFBEB" />
    <circle cx="0" cy="5" r="28" fill="#FFFBEB" />
    <!-- Charred Pepperoni / Cherry Tomatoes -->
    <circle cx="-110" cy="10" r="16" fill="#991B1B" />
    <circle cx="15" cy="-105" r="16" fill="#991B1B" />
    <circle cx="115" cy="12" r="16" fill="#991B1B" />
    <circle cx="5" cy="115" r="16" fill="#991B1B" />
    <circle cx="-85" cy="-100" r="14" fill="#991B1B" />
    <circle cx="95" cy="-95" r="14" fill="#991B1B" />
    <!-- Fresh Basil Leaves -->
    <ellipse cx="-25" cy="-35" rx="22" ry="11" transform="rotate(-30 -25 -35)" fill="#15803D" />
    <ellipse cx="38" cy="25" rx="24" ry="12" transform="rotate(25 38 25)" fill="#16A34A" />
    <ellipse cx="-60" cy="25" rx="20" ry="10" transform="rotate(45 -60 25)" fill="#15803D" />
    <ellipse cx="30" cy="-65" rx="20" ry="10" transform="rotate(-15 30 -65)" fill="#16A34A" />
    <!-- Slice lines -->
    <line x1="-195" y1="0" x2="195" y2="0" stroke="#78350F" stroke-width="2" stroke-opacity="0.35" />
    <line x1="0" y1="-195" x2="0" y2="195" stroke="#78350F" stroke-width="2" stroke-opacity="0.35" />
  </g>
  <!-- Copper Handi Saffron Biryani Bowl (Top Left) -->
  <g transform="translate(240, 210)">
    <circle cx="6" cy="10" r="135" fill="#000000" fill-opacity="0.4" />
    <circle cx="0" cy="0" r="130" fill="#B45309" stroke="#F59E0B" stroke-width="6" />
    <circle cx="0" cy="0" r="114" fill="#FEF3C7" />
    <!-- Saffron rice texture -->
    <circle cx="-35" cy="-25" r="42" fill="#FDE68A" />
    <circle cx="38" cy="20" r="48" fill="#F59E0B" fill-opacity="0.35" />
    <circle cx="-20" cy="45" r="35" fill="#D97706" fill-opacity="0.3" />
    <!-- Spiced delicacies & herbs -->
    <ellipse cx="-25" cy="-15" rx="28" ry="18" transform="rotate(-20 -25 -15)" fill="#92400E" />
    <ellipse cx="32" cy="25" rx="26" ry="16" transform="rotate(15 32 25)" fill="#78350F" />
    <circle cx="25" cy="-35" r="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="4" />
    <ellipse cx="0" cy="5" rx="18" ry="8" fill="#16A34A" />
    <ellipse cx="-40" cy="30" rx="14" ry="7" transform="rotate(35 -40 30)" fill="#15803D" />
  </g>
  <!-- Gourmet Smash Burger & Fries Platter (Bottom Left) -->
  <g transform="translate(260, 505)">
    <rect x="-130" y="-85" width="260" height="170" rx="28" fill="#78350F" stroke="#92400E" stroke-width="4" />
    <circle cx="-40" cy="0" r="64" fill="#D97706" />
    <circle cx="-45" cy="-5" r="56" fill="#F59E0B" />
    <!-- Sesame seeds -->
    <ellipse cx="-60" cy="-25" rx="5" ry="2.5" fill="#FEF3C7" />
    <ellipse cx="-35" cy="-30" rx="5" ry="2.5" fill="#FEF3C7" />
    <ellipse cx="-20" cy="-10" rx="5" ry="2.5" fill="#FEF3C7" />
    <ellipse cx="-55" cy="5" rx="5" ry="2.5" fill="#FEF3C7" />
    <ellipse cx="-30" cy="12" rx="5" ry="2.5" fill="#FEF3C7" />
    <!-- Rosemary Fries -->
    <g fill="#FBBF24" stroke="#D97706" stroke-width="2">
      <rect x="45" y="-50" width="14" height="75" rx="4" transform="rotate(12 45 -50)" />
      <rect x="65" y="-45" width="14" height="80" rx="4" transform="rotate(-8 65 -45)" />
      <rect x="82" y="-40" width="14" height="72" rx="4" transform="rotate(18 82 -40)" />
      <rect x="52" y="-15" width="14" height="70" rx="4" transform="rotate(-15 52 -15)" />
    </g>
    <circle cx="85" cy="42" r="22" fill="#DC2626" stroke="#FFFFFF" stroke-width="4" />
  </g>
  <!-- Artisanal Dessert Bowl (Top Right) -->
  <g transform="translate(1015, 195)">
    <circle cx="5" cy="8" r="105" fill="#000000" fill-opacity="0.4" />
    <circle cx="0" cy="0" r="100" fill="#F5F5F4" />
    <rect x="-55" y="-45" width="110" height="90" rx="18" fill="#451A03" />
    <rect x="-48" y="-38" width="96" height="76" rx="14" fill="#78350F" />
    <circle cx="-18" cy="-10" r="14" fill="#DC2626" />
    <circle cx="15" cy="12" r="12" fill="#DC2626" />
    <ellipse cx="5" cy="-18" rx="16" ry="8" transform="rotate(-25 5 -18)" fill="#16A34A" />
  </g>
</svg>
